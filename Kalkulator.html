<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Kalkulator_20246007</title>
    </head>
    <body>
        <h1>Kalkulator_20246007</h1>
        <script>
            let angka1 = parseFloat(prompt("Masukkan angka pertama:"));
            let angka2 = parseFloat(prompt("Masukkan angka kedua:"));
            let operator = prompt("Masukkan operator (+, -, *, /):");
            let hasil;
            if (operator === "+") {
                hasil = angka1 + angka2;
            } else if (operator === "-") {
                hasil = angka1 - angka2;
            } else if (operator === "*") {
                hasil = angka1 * angka2;
            } else if (operator === "/") {
                if (angka2 !== 0) {
                    hasil = angka1 / angka2;
                } else {
                    hasil = "Error: Tidak bisa membagi dengan Nol!";
                }
            } else {
                hasil = "Error: Operator tidak valid!";
            }
            if (hasil !== undefined && !isNaN(hasil)) {
                alert("Hasil: " + hasil);
            } 
        </script>
    </body>

</html>
